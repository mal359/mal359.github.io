<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
    <link href="css/bootstrap.min.css" rel="stylesheet" media="screen"/>
    <link href="css/template.css" rel="stylesheet" media="screen"/>
    
    <title>This domain has been seized</title>
</head>
<body>
    <div class="videocontainer">
        <img src="images/background.jpg" alt="" />
    </div>

    <div class="container">
        <div class="header clearfix">
            <h3>Notice</h3>
        </div>
        <div class="jumbotron">
            <h1 class="display-3"><strong>THIS DOMAIN HAS BEEN SEIZED</strong></h1>
            <p class="lead">
                by the <strong>Dutch National Police</strong> in conjunction with <strong>Moldovan Cyberunit</strong>, <strong>FBI</strong> and<strong> Europol</strong>  
            </p>
        </div>
        <div class="row marketing">
            <div class="col-sm-12 col-md-3 col-lg-12">
                <img src="images/DM-closed.png" alt="Dutchmasters Closed" class="center" class="img-responsive"/>
            </div>
        </div>
        <footer class="footer">
            <div class="container">
                <div class="col-sm-12 col-md-3">
                    <a href="https://www.politie.nl/" target="_blank">
                        <img src="images/politie.png" class="img-responsive" />
                    </a>
                </div>               
                <div class="col-sm-12 col-md-6">
                    <a href="https://www.prosecutionservice.nl" target="_blank">
                        <img src="images/OM-logo.png" class="img-responsive" />
                    </a>
                </div>
                <div class="col-sm-12 col-md-3">
                    <a href="https://www.europol.europa.eu/" target="_blank">
                        <img src="images/europol.png" class="img-responsive" />
                    </a>
                </div>
            </div>
            <div class="container">
                <div class="col-sm-12 col-md-3 col-lg-3">
                    <img src="images/TCEC-logo.png" alt="Team Cyber Enabled Crime" class="img-responsive"/>
                </div>
                <div class="col-sm-12 col-md-3 col-lg-6">
                    <img src="images/FBI-logo.png" alt="Federal Bureau of Investigation" class="img-responsive"/>
                </div>
                <div class="col-sm-12 col-md-3 col-lg-3">
                    <img src="images/Coat_of_arms_of_Moldova.png" alt="Coat of arms of Moldova" class="img-responsive"/>
                </div>
            </div>
        </footer>
    </div>
    <script type="text/javascript" src="js/ie10-viewport-bug-workaround.js"></script>
</body>
</html>
